# IIT Tunnel Hub — frps + hub (API y panel)
# Uso:  cp .env.example .env  &&  (editar .env)  &&  docker compose up -d --build
#
# Ambos servicios usan la red del host (solo Linux): frps necesita abrir 80/443, el puerto
# de control y el rango TCP, y el hub y frps se hablan por 127.0.0.1 sin exponer nada más.

services:
  hub:
    build: ./api
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /data/hub.db
    volumes:
      - hub-data:/data
    restart: unless-stopped

  frps:
    build: ./frps
    network_mode: host
    env_file: .env
    depends_on:
      - hub
    restart: unless-stopped

  # Escritorio remoto (RDP) en el navegador: el hub le habla en 127.0.0.1:4822 y guacd entra a los
  # puertos locales del frpc del hub (127.0.0.1:REMOTE_PORT_BASE+id), por eso también usa la red del host
  guacd:
    image: guacamole/guacd:1.5.5
    network_mode: host
    command: ["/opt/guacamole/sbin/guacd", "-b", "127.0.0.1", "-l", "4822", "-f"]
    restart: unless-stopped

volumes:
  hub-data:
